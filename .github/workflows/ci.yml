name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (JDK 21 / ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run tests
        run: ./gradlew test

      - name: Verify SKIP=FAIL (CLAUDE.md Test Rule 1)
        if: always()
        run: |
          skipped=$(find app -path '*/build/test-results/test/*.xml' \
            -exec grep -h 'testsuite' {} \; \
            | grep -oP 'skipped="\K[0-9]+' | awk '{sum+=$1} END {print sum+0}')
          if [ "$skipped" -gt 0 ]; then
            echo "::error::$skipped skipped tests detected. CLAUDE.md Test Rule 1: SKIP=FAIL"
            exit 1
          fi
          echo "✅ No skipped tests (SKIP=FAIL passed)"

      - name: Build
        run: ./gradlew build

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/test-results/
          retention-days: 7
